<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRAM PANCHAYAT MANDUR</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        /* --- CSS VARIABLES & RESET --- */
        :root {
            --gov-blue: #003366;
            --gov-orange: #ff9933;
            --text-light: #ffffff;
            --header-height-desktop: 175px;
            --gov-green: #28a745;
            --transition-smooth: all 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Mukta', Arial, sans-serif;
            background-color: #f4f6f9;
            padding-top: var(--header-height-desktop);
            scroll-behavior: smooth;
        }

        /* --- HEADER & BRANDING --- */
        .gov-header-group {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .top-strip {
            background-color: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            padding: 5px 0;
            font-size: 0.9rem;
        }

            .top-strip a {
                text-decoration: none;
                color: var(--gov-blue);
                font-weight: 600;
                transition: var(--transition-smooth);
                padding: 4px 8px;
                border-radius: 3px;
            }

        .main-brand {
            max-width: 1200px;
            margin: 0 auto;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            gap: 20px;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        #txt-title {
            margin: 0;
            font-size: 1.8rem;
            color: var(--gov-blue);
            font-weight: 800;
            text-transform: uppercase;
        }

        /* --- NAVIGATION --- */
        .main-nav {
            background-color: var(--gov-blue);
        }

            .main-nav ul {
                list-style: none;
                padding: 0;
                margin: 0;
                display: flex;
                justify-content: center;
                max-width: 1200px;
                margin: 0 auto;
            }

            .main-nav li a {
                display: block;
                padding: 12px 18px;
                color: white;
                text-decoration: none;
                font-weight: 500;
                transition: 0.3s;
            }

        .btn-login {
            background: #dc3545 !important;
        }

        /* --- HERO SLIDER --- */
        .hero-section {
            position: relative;
            width: 100%;
            height: 500px;
            overflow: hidden;
            background: #ddd;
        }

        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            background-size: cover;
            background-position: center;
        }

            .slide.active {
                opacity: 1;
            }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-content {
            color: white;
            padding: 20px;
        }

        /* --- TICKER --- */
        .news-ticker {
            background: var(--gov-blue);
            color: white;
            padding: 10px 0;
            display: flex;
        }

        .marquee-content {
            display: inline-block;
            animation: scroll-left 20s linear infinite;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(100%);
            }

            100% {
                transform: translateX(-100%);
            }
        }

        /* --- UTILITY --- */
        .menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
        }

        /* Responsive */
        @media (max-width: 992px) {
            body {
                padding-top: 100px;
            }

            .top-strip, .landmark-desktop {
                display: none;
            }

            .main-nav {
                position: fixed;
                left: -280px;
                top: 0;
                width: 280px;
                height: 100vh;
                z-index: 1002;
                transition: 0.3s;
                background: var(--gov-blue);
            }

                .main-nav.active {
                    left: 0;
                }

                .main-nav ul {
                    flex-direction: column;
                }

            .mobile-toggle-btn {
                display: block !important;
            }
        }
    </style>
</head>
<body>

    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>

    <header class="gov-header-group">
        <div class="top-strip">
            <div style="max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; padding: 0 20px;">
                <span><i class="fas fa-phone-alt"></i> <span id="txt-helpline">Help Line</span>: +91-7378418453</span>
                <span>
                    <a href="javascript:void(0)" onclick="setLanguage('en')">English</a> |
                    <a href="javascript:void(0)" onclick="setLanguage('mr')" style="color: var(--gov-orange);">मराठी</a>
                </span>
            </div>
        </div>

        <div class="main-brand">
            <div class="brand-info">
                <button class="mobile-toggle-btn" style="display:none;" onclick="openMenu()"><i class="fas fa-bars"></i></button>
                <i class="fas fa-landmark fa-3x landmark-desktop" style="color: var(--gov-blue);"></i>
                <div>
                    <h1 id="txt-title">GRAM PANCHAYAT MANDUR</h1>
                    <p id="txt-subtitle">Taluka: Gaganbawada | District: Kolhapur</p>
                </div>
            </div>
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" height="70" alt="Emblem">
        </div>

        <nav class="main-nav" id="sidebarMenu">
            <button class="sidebar-close-btn" style="display:none;" onclick="closeMenu()"><i class="fas fa-times"></i></button>
            <ul>
                <li><a href="index.html" class="active" id="nav-home">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li style="margin-left: auto;"><a href="admin.html" class="btn-login">Login</a></li>
            </ul>
        </nav>
    </header>

    <div class="hero-section" id="hero-slider">
        <div class="slide active" style="background-image: url('https://upload.wikimedia.org/wikipedia/commons/e/e4/Gram_Panchayat_Office%2C_Mararikulam_North.jpg');"></div>
        <div class="hero-overlay">
            <div class="hero-content">
                <h2 id="hero-title">Welcome to Mandur</h2>
                <p id="hero-desc">Digital Gateway to Our Village Development</p>
            </div>
        </div>
    </div>

            projectId: "ecogrampanchayatmandur",
            storageBucket: "ecogrampanchayatmandur.firebasestorage.app",

        // --- GLOBAL FUNCTIONS ---
        window.openMenu = () => {
            document.getElementById('sidebarMenu').classList.add('active');
            document.getElementById('menuOverlay').style.display = 'block';
        };

        window.closeMenu = () => {
            document.getElementById('sidebarMenu').classList.remove('active');
            document.getElementById('menuOverlay').style.display = 'none';
        };

        // --- DATA LOADING ---

        loadHomeData();
    </script>
</body>
</html>
